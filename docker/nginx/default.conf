server {
    listen 80;
    server_name _;

    # Wichtig: Document Root zeigt direkt auf /var/www/html/public
    root /var/www/html/public;
    index index.php;

    # Keine doppelten Slashes in internen Redirects
    absolute_redirect off;

    # Schlichtes Access/Error Logging (optional kannst du das anpassen)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Alles Normale erstmal als statisch versuchen,
    # wenn nicht vorhanden → /index.php durchreichen.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-Dateien an PHP-FPM weiterreichen
    location ~ \.php$ {
        include fastcgi_params;

        # Im Compose-Netz ist der Service-Name der stabile Hostname.
        fastcgi_pass php:9000;

        # echtes Skript auflösen
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;

        # damit Redirects wie Location: login.php korrekt werden
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Standard
        fastcgi_index index.php;
    }

    # Security: keine .ht* o.ä.
    location ~ /\.ht {
        deny all;
    }
}
